<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Task-Tracker-with-Badges.css">
</head>
<body>
    <header class="bg-primary text-white py-4"><div class="container d-flex justify-content-between align-items-center"><h1 class="h3 mb-0">My Tasks</h1><span class="badge bg-warning text-dark fs-6">3 pending</span></div></header>
    <main class="container py-5">
        <div class="row justify-content-center"><section class="col-lg-8"><h2 class="h4 mb-3">Today's List</h2>
            <ul class="list-group shadow-sm">
                <li class="list-group-item d-flex justify-content-between align-items-center gap-3"><span>Finish Bootstrap assignment</span><span class="badge bg-danger">High</span></li>
                <li class="list-group-item d-flex justify-content-between align-items-center gap-3"><span>Revise CSS Grid</span><span class="badge bg-warning text-dark">Medium</span></li>
                <li class="list-group-item d-flex justify-content-between align-items-center gap-3"><span>Organize project files</span><span class="badge bg-success">Low</span></li>
            </ul>
            <button class="btn btn-success mt-4" type="button">Completed <span class="badge bg-light text-success">1</span></button>
        </section></div>
    </main>
    <footer class="text-center py-3">One task at a time.</footer>
</body>
</html>
