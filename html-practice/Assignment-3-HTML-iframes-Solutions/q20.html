<!DOCTYPE html>
<html lang="en">
<head>
    <!-- title gives the page its browser tab title. -->
    <title>Complete Head Elements</title>
    <!-- charset defines character encoding. -->
    <meta charset="UTF-8">
    <!-- description provides a summary of the webpage. -->
    <meta name="description" content="A page demonstrating important HTML head elements.">
    <!-- author identifies the creator. -->
    <meta name="author" content="Sohum Sabhani">
    <!-- base sets the base URL for relative URLs. -->
    <base href="https://example.com/">
    <!-- link connects the page to a favicon or other resource. -->
    <link rel="icon" href="data:,">
    <!-- style can contain CSS rules; it is empty here. -->
    <style></style>
    <!-- script can contain JavaScript; it is empty here. -->
    <script></script>
</head>
<body>
    <h1>Important HTML Head Elements</h1>
    <p>This page demonstrates the important elements used inside the HTML head.</p>
</body>
</html>
