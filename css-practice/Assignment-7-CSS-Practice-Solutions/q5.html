<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced CSS Selectors</title><link rel="stylesheet" href="q5.css">
</head>
<body>
<main>
    <h1>Advanced CSS Selectors</h1>
    <section class="content">
        <input type="text" placeholder="Text input">
        <ul class="items">
            <li>First item</li><li>Second item</li><li>Third item</li><li>Fourth item</li>
        </ul>
        <div class="links">
            <a href="https://example.com">Secure Link</a>
            <a href="http://example.com">Regular Link</a>
        </div>
        <p class="note">This paragraph demonstrates descendant and sibling selectors.</p>
    </section>
</main>
</body>
</html>
