<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter Gallery</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>
    <header><h1>Image Filter Gallery</h1></header>
    <main>
        <section class="gallery">
            <figure class="blur"><img src="https://picsum.photos/id/1015/500/300" alt="Mountain river"><figcaption>Blur</figcaption></figure>
            <figure class="gray"><img src="https://picsum.photos/id/1011/500/300" alt="Forest lake"><figcaption>Grayscale</figcaption></figure>
            <figure class="sepia"><img src="https://picsum.photos/id/1018/500/300" alt="Mountain view"><figcaption>Sepia</figcaption></figure>
            <figure class="bright"><img src="https://picsum.photos/id/1020/500/300" alt="Coast"><figcaption>Brightness</figcaption></figure>
            <figure class="contrast"><img src="https://picsum.photos/id/1039/500/300" alt="Waterfall"><figcaption>Contrast</figcaption></figure>
            <figure class="hue"><img src="https://picsum.photos/id/1043/500/300" alt="Ocean"><figcaption>Hue Rotate</figcaption></figure>
        </section>
    </main>
</body>
</html>
