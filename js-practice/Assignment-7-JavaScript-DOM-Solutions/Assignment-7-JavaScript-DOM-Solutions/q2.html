<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Character Counter</title>
<style>body{font-family:Arial;max-width:520px;margin:30px auto}textarea{width:100%;height:130px;box-sizing:border-box;padding:10px}.counter{font-weight:bold}.warning{color:#c99a00}.danger{color:red}</style></head>
<body>
<h2>Live Character Counter</h2>
<textarea id="message" maxlength="100" placeholder="Type up to 100 characters..."></textarea>
<p>Remaining: <span id="counter" class="counter">100</span></p>
<button id="reset">Reset</button>
<script>
"use strict";
const message=document.getElementById("message"),counter=document.getElementById("counter");
function updateCounter(){const remaining=100-message.value.length;counter.textContent=remaining;counter.classList.toggle("warning",remaining<=20&&remaining>0);counter.classList.toggle("danger",remaining===0);}
message.addEventListener("input",updateCounter);
message.addEventListener("beforeinput",event=>{
    if(message.value.length>=100&&event.data){event.preventDefault();}
});
document.getElementById("reset").addEventListener("click",()=>{message.value="";updateCounter();message.focus();});
</script>
</body></html>
