<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>
    <header><h1>Borders &amp; Padding</h1></header>
    <main>
        <section class="boxes">
            <article class="box solid"><h2>Solid Border</h2><p>Standard solid border.</p></article>
            <article class="box dashed"><h2>Dashed Border</h2><p>Dashed border example.</p></article>
            <article class="box double"><h2>Double Border</h2><p>Double border example.</p></article>
            <article class="box groove"><h2>Groove Border</h2><p>Groove border example.</p></article>
            <article class="box rounded"><h2>Rounded Corners</h2><p>Uses border-radius.</p></article>
        </section>
    </main>
    <footer><p>Border and padding demonstration</p></footer>
</body>
</html>
