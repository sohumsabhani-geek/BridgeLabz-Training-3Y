<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Personal-Portfolio-Basics.css">
</head>
<body class="bg-light text-dark">
    <header class="container text-center mt-4 mb-3 p-5 rounded-4">
        <img class="img-fluid rounded-circle profile-image mb-3" src="https://picsum.photos/id/1005/240/240" alt="Profile portrait">
        <h1 class="fw-bold">Alex Morgan</h1>
        <p class="lead">Web Design Student | Learning by Building</p>
        <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
        <a href="#" class="btn btn-outline-primary">Download CV</a>
    </header>
    <main class="container">
        <section class="text-center mb-5">
            <h2>About Me</h2>
            <p class="mx-auto intro">I enjoy creating clean websites and learning how design and code work together. I am currently practicing HTML, CSS and Bootstrap.</p>
        </section>
        <section id="contact" class="card p-4 mb-5">
            <h2 class="h4 text-center">Contact Me</h2>
            <form>
                <label for="name" class="form-label">Name</label>
                <input id="name" class="form-control mb-3" type="text" placeholder="Your name">
                <label for="email" class="form-label">Email</label>
                <input id="email" class="form-control mb-3" type="email" placeholder="you@example.com">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" class="form-control mb-3" rows="3" placeholder="Write your message"></textarea>
                <button class="btn btn-primary" type="button">Send Message</button>
            </form>
        </section>
    </main>
    <footer class="text-center p-3">Portfolio Practice Page</footer>
</body>
</html>
