<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Form Builder</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 30px auto; }
        label { display: block; margin: 12px 0; }
        input, select, textarea { display: block; width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; }
        pre { background: #f3f3f3; padding: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Dynamic Form Builder</h2>
    <form id="dynamicForm"></form>
    <h3>Submitted data</h3>
    <pre id="output">Submit the form to see values.</pre>
    <script>
        "use strict";
        class FormBuilder {
            constructor(fields, formElement, outputElement) {
                this.fields = fields;
                this.formElement = formElement;
                this.outputElement = outputElement;
                this.render();
            }

            render() {
                this.formElement.innerHTML = "";
                for (const field of this.fields) {
                    const label = document.createElement("label");
                    label.textContent = field.label;
                    const input = document.createElement(field.type === "textarea" ? "textarea" : "input");
                    if (field.type !== "textarea") input.type = field.type;
                    input.name = field.name;
                    input.required = Boolean(field.required);
                    label.appendChild(input);
                    this.formElement.appendChild(label);
                }
                const submit = document.createElement("button");
                submit.type = "submit";
                submit.textContent = "Submit";
                this.formElement.appendChild(submit);
            }

            getFormData() {
                const data = {};
                for (const field of this.fields) {
                    const input = this.formElement.elements.namedItem(field.name);
                    data[field.name] = input.value;
                }
                return data;
            }
        }

        const builder = new FormBuilder([
            { type: "text", label: "Username", name: "username", required: true },
            { type: "email", label: "Email", name: "email", required: true },
            { type: "textarea", label: "About you", name: "about", required: false }
        ], document.getElementById("dynamicForm"), document.getElementById("output"));

        builder.formElement.addEventListener("submit", event => {
            event.preventDefault();
            builder.outputElement.textContent = JSON.stringify(builder.getFormData(), null, 2);
        });
    </script>
</body>
</html>
