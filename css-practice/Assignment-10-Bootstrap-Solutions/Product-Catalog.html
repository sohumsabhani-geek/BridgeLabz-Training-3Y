<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Everyday Store | Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Product-Catalog.css">
</head>
<body>
    <header class="bg-dark text-white py-3"><div class="container"><h1 class="h3 mb-0">Everyday Store</h1></div></header>
    <main class="container py-5">
        <h2 class="mb-4">Popular Products</h2>
        <!-- col-12, col-sm-6 and col-md-3 make 1, 2 and 4 columns at different widths. -->
        <div class="row g-4">
            <div class="col-12 col-sm-6 col-md-3"><article class="card product h-100"><img src="https://picsum.photos/seed/bag/500/350" class="card-img-top" alt="Canvas bag"><div class="card-body"><h3 class="h5">Canvas Bag</h3><p>₹799</p><button class="btn btn-primary">Add to Cart</button></div></article></div>
            <div class="col-12 col-sm-6 col-md-3"><article class="card product h-100"><img src="https://picsum.photos/seed/headphones/500/350" class="card-img-top" alt="Headphones"><div class="card-body"><h3 class="h5">Headphones</h3><p>₹1,499</p><button class="btn btn-primary">Add to Cart</button></div></article></div>
            <div class="col-12 col-sm-6 col-md-3"><article class="card product h-100"><img src="https://picsum.photos/seed/watch/500/350" class="card-img-top" alt="Wrist watch"><div class="card-body"><h3 class="h5">Classic Watch</h3><p>₹1,999</p><button class="btn btn-primary">Add to Cart</button></div></article></div>
            <div class="col-12 col-sm-6 col-md-3"><article class="card product h-100"><img src="https://picsum.photos/seed/bottle/500/350" class="card-img-top" alt="Water bottle"><div class="card-body"><h3 class="h5">Water Bottle</h3><p>₹499</p><button class="btn btn-primary">Add to Cart</button></div></article></div>
        </div>
    </main>
    <footer class="text-center bg-light p-3">Everyday Store · Shop useful things</footer>
</body>
</html>
