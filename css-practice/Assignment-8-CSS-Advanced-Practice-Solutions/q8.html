<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Box Sizing Comparison</title><link rel="stylesheet" href="q8.css"></head>
<body>
<main><h1>Box-Sizing Comparison</h1><section class="comparison">
<article class="default"><h2>Default</h2><div class="box">Width: 300px<br>Padding: 30px<br>Border: 10px<br><strong>Content-box</strong></div><p>Padding and border are added outside the declared width.</p></article>
<article class="border"><h2>Border-box</h2><div class="box">Width: 300px<br>Padding: 30px<br>Border: 10px<br><strong>Border-box</strong></div><p>Padding and border are included inside the declared width.</p></article>
</section></main>
</body></html>
