<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Theme Switcher</title>
<style>
body{font-family:Arial;margin:30px;padding:20px;transition:background .2s,color .2s}
body[data-theme="light"]{background:#fff;color:#222}body[data-theme="dark"]{background:#222;color:#f4f4f4}
body[data-theme="blue"]{background:#dceeff;color:#123b66}button{padding:8px;margin-right:6px}
</style></head><body data-theme="light">
<h2>Theme Switcher</h2><p>Choose a theme to change this page.</p>
<button data-theme-choice="light">Light</button><button data-theme-choice="dark">Dark</button><button data-theme-choice="blue">Blue</button>
<p>Current theme: <strong id="current">light</strong></p>
<script>
"use strict";
const body=document.body,current=document.getElementById("current");
document.querySelectorAll("button[data-theme-choice]").forEach(button=>{
    button.addEventListener("click",()=>{
        const theme=button.getAttribute("data-theme-choice");
        body.setAttribute("data-theme",theme);
        body.setAttribute("data-current-theme",theme);
        body.classList.remove("theme-light","theme-dark","theme-blue");
        body.classList.add(`theme-${theme}`);
        current.textContent=body.getAttribute("data-current-theme");
    });
});
</script></body></html>
