<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Model Exploration</title><link rel="stylesheet" href="q8.css">
</head>
<body>
<main>
<h1>CSS Box Model</h1>
<section class="demo">
    <div class="margin-layer">
        <span class="label margin-label">Margin</span>
        <div class="border-layer">
            <span class="label border-label">Border</span>
            <div class="padding-layer">
                <span class="label padding-label">Padding</span>
                <div class="content-layer">
                    <span class="label content-label">Content</span>
                </div>
            </div>
        </div>
    </div>
</section>
<section class="description">
<p><strong>Content:</strong> The actual text or element content.</p>
<p><strong>Padding:</strong> Space between content and border.</p>
<p><strong>Border:</strong> The edge surrounding padding and content.</p>
<p><strong>Margin:</strong> Space outside the border.</p>
<p><strong>Box sizing:</strong> border-box includes padding and border within the declared size.</p>
</section>
</main>
</body>
</html>
