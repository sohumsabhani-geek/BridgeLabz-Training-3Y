<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Notifications-Dashboard.css">
</head>
<body>
    <header class="bg-dark text-white py-3"><div class="container"><h1 class="h3 mb-0">Notifications</h1></div></header>
    <main class="container py-5">
        <div class="row g-4">
            <section class="col-lg-8"><div class="card p-4"><h2 class="h4 mb-3">Recent Updates</h2>
                <div class="alert alert-success" role="alert"><strong>Success:</strong> Your profile has been updated.</div>
                <div class="alert alert-info" role="alert"><strong>Tip:</strong> Add a profile photo to complete your account.</div>
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <strong>Warning:</strong> Your password will expire soon.
                    <!-- Bootstrap's dismiss button hides this alert. -->
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            </div></section>
            <aside class="col-lg-4"><section class="summary p-4 bg-light border rounded"><h2 class="h4">Summary</h2><p>Notifications today: <strong>3</strong></p><p>Unread: <strong>1</strong></p><p class="mb-0">Last checked: Today</p></section></aside>
        </div>
    </main>
    <footer class="text-center py-3">Dashboard Practice</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
