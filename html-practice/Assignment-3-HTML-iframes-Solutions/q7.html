<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>
<body>
    <h1>Login</h1>
    <form>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username">
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>
        <!-- A CSRF token helps verify that a request came from the intended website. -->
        <input type="hidden" name="csrf_token" value="dummy-csrf-token-12345">
        <button type="submit">Login</button>
    </form>
</body>
</html>
