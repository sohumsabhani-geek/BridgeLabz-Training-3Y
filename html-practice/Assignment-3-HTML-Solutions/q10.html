<!DOCTYPE html>
<html>
<head><title>Travel Selection</title></head>
<body>
<h1>Select Your Travel Destination</h1>
<label for="country">Country:</label>
<select id="country">
    <option value="india" selected>India</option>
    <option value="japan">Japan</option>
    <option value="france">France</option>
</select>
<br><br>
<label for="state">State:</label>
<select id="state">
    <option value="up" selected>Uttar Pradesh</option>
    <option value="delhi">Delhi</option>
    <option value="rajasthan">Rajasthan</option>
</select>
<br><br>
<label for="city">City:</label>
<select id="city">
    <option value="mathura" selected>Mathura</option>
    <option value="agra">Agra</option>
    <option value="lucknow">Lucknow</option>
</select>
<br><br>
<label for="place">Favorite Tourist Place:</label>
<select id="place">
    <option value="tajmahal" selected>Taj Mahal</option>
    <option value="vrindavan">Vrindavan</option>
    <option value="agrafort">Agra Fort</option>
</select>
<p>My selected destination is India, Uttar Pradesh, Mathura, and my favorite tourist place is the Taj Mahal.</p>
</body>
</html>
