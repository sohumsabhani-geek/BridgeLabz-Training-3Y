<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creative Formatting</title>
</head>
<body>
    <!-- Multiple inline formatting elements -->
    <p>
        <strong>Learning HTML</strong> is <em>interesting</em> and
        <mark>useful</mark> for web development.<br>
        <small>Keep practicing to improve your skills.</small>
    </p>
</body>
</html>
